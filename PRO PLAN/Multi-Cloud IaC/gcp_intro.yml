terraform {
  required_providers {
    google = {
      source = "hashicorp/google"
    }
  }
}

provider "google" {
  project = "YOUR_PROJECT_ID"
  region  = "asia-south1"
}

resource "google_storage_bucket" "demo_bucket" {
  name     = "student-terraform-gcp-UNIQUE-ID"
  location = "ASIA-SOUTH1"
}
