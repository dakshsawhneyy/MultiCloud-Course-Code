steps:

  - name: "node:20"
    entrypoint: "npm"
    args:
      - "install"

  - name: "node:20"
    entrypoint: "npm"
    args:
      - "test"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/demo-repository/gcp-cicd-demo:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/demo-repository/gcp-cicd-demo:$SHORT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "gcp-cicd-demo"
      - "--image"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/demo-repository/gcp-cicd-demo:$SHORT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
