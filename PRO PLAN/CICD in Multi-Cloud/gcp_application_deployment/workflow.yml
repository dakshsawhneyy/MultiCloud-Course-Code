name: Docker Hub & GCP VM Pipeline

on:
push:
branches: ["main"]

jobs:
build-test-deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm ci

  - name: Run tests
    run: npm test

  - name: Run dependency security check
    run: npm audit

  - name: Run Trivy filesystem scan
    uses: aquasecurity/trivy-action@v0.36.0
    with:
      scan-type: fs
      severity: CRITICAL
      format: table
      exit-code: "1"

  - name: Gitleaks secrets scan
    uses: gitleaks/gitleaks-action@v2

  - name: Build Docker image locally
    run: |
      docker build \
        -t ${{ secrets.DOCKERHUB_USERNAME }}/gcp-cicd-demo:${{ github.sha }} \
        -t ${{ secrets.DOCKERHUB_USERNAME }}/gcp-cicd-demo:latest .

  - name: Scan Docker image with Trivy
    uses: aquasecurity/trivy-action@v0.36.0
    with:
      image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gcp-cicd-demo:${{ github.sha }}'
      severity: CRITICAL
      format: table
      exit-code: "1"

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Push Docker image
    run: |
      docker push ${{ secrets.DOCKERHUB_USERNAME }}/gcp-cicd-demo:${{ github.sha }}
      docker push ${{ secrets.DOCKERHUB_USERNAME }}/gcp-cicd-demo:latest

  - name: Deploy to GCP VM via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.VM_HOST }}
      username: ${{ secrets.VM_USERNAME }}
      key: ${{ secrets.VM_SSH_KEY }}
      port: 22
      script: |
        set -e

        # Login to Docker Hub on the GCP VM
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin

        # Pull the new image
        docker pull \
          ${{ secrets.DOCKERHUB_USERNAME }}/gcp-cicd-demo:${{ github.sha }}

        # Stop the old container
        docker stop gcp-cicd-demo || true

        # Remove the old container
        docker rm gcp-cicd-demo || true

        # Start the new container
        docker run -d \
          --name gcp-cicd-demo \
          -p 80:3000 \
          --restart always \
          ${{ secrets.DOCKERHUB_USERNAME }}/gcp-cicd-demo:${{ github.sha }}

        # Verify deployment
        docker ps
```
