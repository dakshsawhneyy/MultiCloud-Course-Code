# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec :
      containers:
        - name: node-app
          image: public.ecr.aws/j1u5n1x0/prod/sample-node-app:v1
          ports:
            - containerPort: 3000
---

# Service
apiVersion: v1
kind: Service
metadata:
  name: node-app-svc
spec:
  type: LoadBalancer
  selector:
    app: node-app
  ports:
    - port: 80
      targetPort: 3000
